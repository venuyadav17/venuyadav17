name: Generate Snake Animation

# Allows manual trigger and scheduled daily at 00:30 UTC
on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *' 
  push:
    branches:
      - main
      - master

# Explicitly grant write permissions to contents so push will succeed
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg
            dist/snake-light.svg?palette=github-dark
            dist/snake-color.svg?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3d8ce7,#367de6,#295aa4,#204886

      - name: Configure Git for push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and Push snake animation files
        run: |
          git add dist/*.svg
          git commit -m "chore: update snake animation [skip ci]" || echo "No changes to commit"
          git push origin output --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
