name: Generate Snake Animation
on:
  schedule:
    # Runs daily at 0:30 AM UTC
    - cron: '30 0 * * *'
  workflow_dispatch: # Allows manual triggering
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      # Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4
        
      # Generate snake animation
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg
            dist/snake-light.svg?palette=github-dark
            dist/snake-color.svg?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3d8ce7,#367de6,#295aa4,#204886
          
      # Push generated files back to repo
      - name: Push snake files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
